<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耳朵學院 EP007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="background">
    <div class="grain"></div>
    <div class="vignette"></div>
</div>

<main id="experience">
    <section class="layer is-active" data-layer="cover">
        <div class="content">
            <p class="label">ep007</p>
            <h1>耳朵學院</h1>
            <div class="copy">
                <p class="lead">《耳朵學院》是一所限時開放的感知場所，引導參與者重新學習如何用耳朵感知世界。在資訊過載的時代，人們對周遭一切變得麻木。耳朵學院「限時開課」的機制，將聽覺轉化為一套可被設計與訓練的感知系統。</p>
                <p class="lead">觀眾以「學員」身份進入課程完成一系列聽覺任務，重新校準人與環境之間的感知關係。<span class="hint-inline">這不是一件靜態的作品，而是一段不可重複的感知經驗。</span></p>
            </div>
            <button class="primary" id="enterBtn" disabled>初始化中...</button>
        </div>
    </section>
</main>

<script>

const launchDate = new Date("2026-03-22T20:00:00").getTime();
const button = document.getElementById("enterBtn");
let hasActivated = false;

function updateCountdown() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance <= 0 && !hasActivated) {
        hasActivated = true;

        button.innerHTML = "課程開放";
        button.classList.add("live-transition");

        setTimeout(() => {
            button.innerHTML = "進入";
            button.disabled = false;
        }, 1000);

        return;
    }

    if (!hasActivated) {
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((distance / (1000 * 60)) % 60);
        const seconds = Math.floor((distance / 1000) % 60);

        button.innerHTML = `${days}天 ${hours}時 ${minutes}分 ${seconds}秒`;
    }
}

setInterval(updateCountdown, 1000);
updateCountdown();

button.addEventListener("click", function() {
    if (!button.disabled) {
        window.location.href = "ep007.html";
    }
});

</script>

</body>
</html>
