<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timed Games EP007</title>

<style>

/* ===== Base ===== */

body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: #000;
    color: #fff;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
}

.container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 60px;
    box-sizing: border-box;
}

/* ===== Layout ===== */

.top-section {
    display: flex;
    flex: 1;
    gap: 80px;
}

.poster {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.poster img {
     width: 100%;
    max-width: 480px;
    height: auto;
}

.description {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 520px;
}

/* ===== Typography ===== */

.description h1 {
    font-size: 2rem;
    margin-bottom: 1.2rem;
    letter-spacing: 1px;
    font-weight: 500;
}

.description p {
    line-height: 1.9;
    opacity: 0.75;
    font-size: 1rem;
}

/* ===== Bottom ===== */

.bottom-section {
    margin-top: 80px;
    text-align: center;
}

/* ===== Button ===== */

button {
    padding: 20px 70px;
    font-size: 1rem;
    letter-spacing: 2px;
    background: #fff;
    color: #000;
    border: none;
    cursor: pointer;
    transition: all 0.4s ease;
    min-width: 260px;
}

button:disabled {
    background: #111;
    color: #666;
    border: 1px solid #333;
    cursor: not-allowed;
}

button.live-transition {
    background: #fff;
    color: #000;
}

/* ===== Mobile Only: 放大文字，不動版型 ===== */

@media (max-width: 768px) {
   .top-section {
        flex-direction: column;
        gap: 40px;
    }
    .poster img {
        max-width: 100%;
    }
    body {
        font-size: 16px;
    }

    .description h1 {
        font-size: 1.2rem;
    }

    .description p {
        font-size: 1.0rem;
    }

    button {
        font-size: 1.1rem;
        padding: 22px 40px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="top-section">
        
        <div class="poster">
            <img src="poster.jpg" alt="Universal Insight Poster">
        </div>

        <div class="description">
            <h1>限時遊戲 EP007</h1>
            <p>
                投入一段你想要捨棄的厭倦／慾望／聲音，系統會將它崩解剩下一段遙遠的聲響，接著再轉身離開。
                <br><br>
               《限時遊戲》透過身體參與和環境感知機制，將個體的生命經驗轉化為可感知藝術場域。            </p>
        </div>

    </div>

    <div class="bottom-section">
        <button id="enterBtn" disabled>INITIALIZING...</button>
    </div>

</div>

<script>

const launchDate = new Date("2026-03-22T20:00:00").getTime();
const button = document.getElementById("enterBtn");
let hasActivated = false;

function updateCountdown() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance <= 0 && !hasActivated) {
        hasActivated = true;

        button.innerHTML = "NOW LIVE";
        button.classList.add("live-transition");

        setTimeout(() => {
            button.innerHTML = "ENTER";
            button.disabled = false;
        }, 1000);

        return;
    }

    if (!hasActivated) {
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((distance / (1000 * 60)) % 60);
        const seconds = Math.floor((distance / 1000) % 60);

        button.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
}

setInterval(updateCountdown, 1000);
updateCountdown();

button.addEventListener("click", function() {
    if (!button.disabled) {
        window.location.href = "ep007.html";
    }
});

</script>

</body>
</html>
