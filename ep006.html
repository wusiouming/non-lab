<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心裡的聲音</title>
    <style>
        :root {
            --deep-blue: #051628;
            --teal: #1a4a5a;
            --gold: #cfb568;
            --light-gold: #f0e68c;
            --white-glow: rgba(255, 255, 255, 0.8);
            --font-main: "Cinzel", "PingFang TC", "Microsoft JhengHei", serif;
        }

        /* 移除手機端長按彈出選單 */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none; 
        }

        body {
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(circle at 50% 30%, #2a6f85 0%, transparent 60%),
                linear-gradient(to bottom, #020b16 0%, #0b2c3e 100%);
            height: 100dvh; width: 100vw; 
            overflow: hidden;
            font-family: var(--font-main);
            display: flex; align-items: center; justify-content: center;
            color: white; position: relative;
            touch-action: none;
        }

        /* --- 背景裝飾 --- */
        .layer { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .abstract-shape { position: absolute; opacity: 0.4; filter: blur(40px); animation: float 12s infinite ease-in-out; }
        .shape-1 { top: -10%; left: -10%; width: 60%; height: 60%; background: var(--teal); border-radius: 40% 60% 70% 30%; }
        .shape-2 { bottom: -10%; right: -10%; width: 70%; height: 50%; background: #0f3045; border-radius: 30% 70% 70% 30%; animation-delay: -2s; }

        /* --- 主容器 --- */
        .portal-container {
            position: relative; z-index: 10;
            width: 90vw; 
            max-width: 340px; 
            height: 70vh;
            max-height: 520px;
            perspective: 1200px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .portal-card {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
        }

        /* 關鍵修正：翻轉只針對 portal-card，且不影響 JS 設定的縮放 */
        .flipped .portal-card { transform: rotateY(180deg); }

        /* 雙重保證：在翻轉到背面時，隱藏正面元素，防止手機版相機畫面穿透 */
        .flipped .card-front {
            opacity: 0;
            transition: opacity 0s 0.3s; /* 在翻轉動畫(1.2s)進行到四分之一時隱藏正面 */
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; /* 針對 Safari 的修正 */
            backface-visibility: hidden;
            border-radius: 20px; overflow: hidden;
            border: 2px solid var(--gold);
        }

        /* --- 正面：相機與轉盤 --- */
        .card-front { 
            background: #000; display: flex; align-items: center; justify-content: center; 
            transition: opacity 0s 0.3s; /* 翻回來時延遲顯示 */
        }
        #camera-video {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; filter: grayscale(100%) brightness(0.4);
            /* 加入 translateZ(0) 強制硬體加速，防止 iOS 渲染錯誤 */
            transform: scaleX(-1) translateZ(0); z-index: 1;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .vortex {
            width: 160%; height: 160%;
            background: conic-gradient(from 0deg, transparent 0%, #1a4a5a 20%, var(--gold) 50%, #1a4a5a 80%, transparent 100%);
            position: absolute; opacity: 0.4; filter: blur(4px); z-index: 2; mix-blend-mode: screen;
        }

        /* 新增：分析掃描光暈特效 */
        .analysis-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin-top: -10px; margin-left: -10px;
            border-radius: 50%;
            box-shadow: 0 0 50px 20px rgba(207, 181, 104, 0.7), inset 0 0 30px rgba(255, 255, 255, 0.9);
            background: rgba(207, 181, 104, 0.3);
            z-index: 3; opacity: 0; pointer-events: none;
        }
        .analysis-ring.active {
            animation: soulScan 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes soulScan {
            0% { transform: scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: scale(30); opacity: 0.8; }
            100% { transform: scale(35); opacity: 0; }
        }

        .roulette-wrapper {
            position: absolute; z-index: 4;
            width: 250px; height: 250px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--gold);
            z-index: 6; filter: drop-shadow(0 0 8px var(--gold));
        }
        .roulette-ring {
            width: 100%; height: 100%; border-radius: 50%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 2 L50 12 M98 50 L88 50 M50 98 L50 88 M2 50 L12 50 M16 16 L23 23 M84 16 L77 23 M84 84 L77 77 M16 84 L23 77' stroke='%23cfb568' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23cfb568' stroke-width='0.5' stroke-dasharray='2 4'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%23cfb568' stroke-width='1' opacity='0.5'/%3E%3C/svg%3E");
            background-size: contain;
        }

        .face-guide-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 60%;
            border: 2px dashed rgba(207, 181, 104, 0.4);
            border-radius: 50%; z-index: 6;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            padding-bottom: 30px; pointer-events: none;
        }

        .face-guide-text {
            color: var(--light-gold); font-size: 0.8rem;
            letter-spacing: 1px; background: rgba(0,0,0,0.6);
            padding: 4px 12px; border-radius: 12px;
            white-space: nowrap; transition: opacity 0.3s, color 0.3s;
        }

        /* --- 背面 --- */
        .card-back {
            transform: rotateY(180deg);
            background: radial-gradient(circle at center, #1a4a5a 0%, #051628 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 25px;
        }

        .card-back::before {
            content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(207, 181, 104, 0.2);
            border-radius: 15px; pointer-events: none;
        }

        .geometry-bg {
            position: absolute; width: 80%; height: 80%;
            opacity: 0.12; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z' fill='none' stroke='%23cfb568' stroke-width='1'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23cfb568' stroke-width='0.5'/%3E%3C/svg%3E");
            background-size: contain; background-repeat: no-repeat; background-position: center;
            animation: spin 25s linear infinite reverse;
        }

        .oracle-wrapper {
            position: relative; z-index: 5;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .oracle-header {
            font-size: 0.8rem; color: var(--gold);
            letter-spacing: 6px; margin-bottom: 35px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 8px;
        }

        #message-text {
            font-size: 1.25rem; line-height: 1.8; color: #fff;
            font-weight: 400; text-shadow: 0 0 10px rgba(255,255,255,0.2);
            word-break: break-word;
        }

        .corner-ornament {
            position: absolute; width: 25px; height: 25px;
            border: 1.5px solid var(--gold); border-bottom: none; border-right: none;
            top: 20px; left: 20px; opacity: 0.5;
        }
        .c2 { top: 20px; right: 20px; transform: rotate(90deg); }
        .c3 { bottom: 20px; left: 20px; transform: rotate(-90deg); }
        .c4 { bottom: 20px; right: 20px; transform: rotate(180deg); }

        .instruction-bar { 
            position: absolute; bottom: 8%; font-size: 0.85rem; color: #fff; z-index: 20; 
            background: rgba(26, 74, 90, 0.8); padding: 12px 25px; border-radius: 50px; 
            border: 1px solid var(--gold); transition: 0.3s; letter-spacing: 1px;
        }
        .instruction-bar.charging { transform: scale(0.95); background: rgba(207, 181, 104, 0.8); color: #000; font-weight: bold;}
        .instruction-bar.spinning { animation: pulse 0.5s infinite; background: rgba(207, 181, 104, 0.3); color: var(--gold); }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }
        .error-shake {
            animation: errorShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }

        /* --- 開場說明視窗 --- */
        .intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(circle at 50% 30%, #2a6f85 0%, transparent 60%),
                linear-gradient(to bottom, #020b16 0%, #0b2c3e 100%);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 1; transition: opacity 0.8s ease;
        }
        .intro-overlay.hidden {
            opacity: 0; pointer-events: none;
        }
        .intro-box {
            background: transparent;
            border: 1px solid rgba(207, 181, 104, 0.4);
            border-radius: 20px;
            padding: 35px 25px;
            width: 85vw; max-width: 360px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(207, 181, 104, 0.05);
        }
        .intro-title {
            color: var(--gold); font-size: 1.5rem; letter-spacing: 4px; margin-bottom: 25px; font-weight: normal;
        }
        .intro-content {
            text-align: left; margin-bottom: 30px;
        }
        .intro-content p {
            color: rgba(255,255,255,0.8); font-size: 0.85rem; line-height: 1.5; margin-bottom: 12px;
        }
        .intro-content p span {
            color: var(--gold); font-weight: bold; display: block; margin-bottom: 2px; letter-spacing: 1px;
        }
        .intro-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 35px; font-size: 0.95rem; letter-spacing: 2px; border-radius: 30px;
            cursor: pointer; transition: all 0.3s ease; font-family: var(--font-main);
        }
        .intro-btn:hover, .intro-btn:active {
            background: rgba(207, 181, 104, 0.15); box-shadow: 0 0 15px rgba(207, 181, 104, 0.3);
        }
    </style>
</head>
<body>

    <!-- 開場說明視窗 -->
    <div class="intro-overlay" id="intro-modal">
        <div class="intro-box">
            <h1 class="intro-title">心裡的聲音</h1>
            <div class="intro-content">
                <p><span>1. 凝視與連結</span>請將臉部輕輕對準畫面中央的星盤。</p>
                <p><span>2. 凝聚能量</span>指尖長按螢幕不放，感受星盤匯聚光芒與震動，直至能量充盈。</p>
                <p><span>3. 釋放命運</span>隨心所欲地鬆開手指，讓星盤自由旋轉。</p>
                <p><span>4. 領受啟示</span>若能量穩定，星盤將為你翻開命運之牌；若受到雜訊干擾，請閉上眼深呼吸，再次嘗試感應。</p>
            </div>
            <button class="intro-btn" id="start-btn">開啟感應</button>
        </div>
    </div>

    <div class="layer">
        <div class="abstract-shape shape-1"></div>
        <div class="abstract-shape shape-2"></div>
    </div>

    <div class="portal-container" id="portal-container">
        <div class="portal-card" id="portal-card">
            <div class="card-face card-front">
                <video id="camera-video" autoplay playsinline muted></video>
                <div class="vortex" id="vortex-bg"></div>
                <!-- 分析掃描光暈層 -->
                <div class="analysis-ring" id="analysis-ring"></div>
                <div class="roulette-wrapper">
                    <div class="pointer"></div>
                    <div class="roulette-ring" id="roulette-ring"></div>
                </div>
                <div class="face-guide-overlay">
                    <div class="face-guide-text" id="guide-text">請將臉部對準中央</div>
                </div>
            </div>
            
            <div class="card-face card-back">
                <div class="geometry-bg"></div>
                <div class="corner-ornament"></div>
                <div class="corner-ornament c2"></div>
                <div class="corner-ornament c3"></div>
                <div class="corner-ornament c4"></div>
                <div class="oracle-wrapper">
                    <div class="oracle-header">Universal Insight</div>
                    <div id="message-text">...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="instruction-bar" id="main-hint">按住螢幕為星盤蓄能，鬆開擲出</div>

    <script>
        const SoundEngine = (() => {
            let ctx = null;
            let riser = null;
            let droneNodes = [];

            const init = () => {
                if (ctx) return;
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            };

            const startInteractionSounds = () => {
                if (!ctx) return;
                const now = ctx.currentTime;
                [55, 110].forEach(f => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.frequency.setValueAtTime(f, now);
                    g.gain.setValueAtTime(0, now);
                    g.gain.linearRampToValueAtTime(0.08, now + 1);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start();
                    droneNodes.push({osc, g});
                });
                riser = ctx.createOscillator();
                const riserGain = ctx.createGain();
                riser.type = 'sawtooth';
                riser.frequency.setValueAtTime(60, now);
                riserGain.gain.setValueAtTime(0, now);
                riserGain.gain.linearRampToValueAtTime(0.08, now + 1);
                riser.connect(riserGain); riserGain.connect(ctx.destination);
                riser.start();
            };

            const updateChargePitch = (velocity) => {
                if (riser && ctx) riser.frequency.setTargetAtTime(60 + (velocity * 30), ctx.currentTime, 0.1);
            };

            const releaseSpin = () => {
                if(riser) { try { riser.stop(); riser = null; } catch(e){} }
            };

            const stopInteractionSounds = () => {
                if (!ctx) return;
                const now = ctx.currentTime;
                droneNodes.forEach(node => {
                    node.g.gain.cancelScheduledValues(now);
                    node.g.gain.linearRampToValueAtTime(0, now + 0.3);
                    setTimeout(() => { try { node.osc.stop(); } catch(e){} }, 400);
                });
                droneNodes = [];
                if(riser) { try { riser.stop(); riser = null; } catch(e){} }
            };

            // 新增：分析掃描音效，帶有頻率攀升與震動感
            const playAnalysis = () => {
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 1.2);
                
                g.gain.setValueAtTime(0, now);
                g.gain.linearRampToValueAtTime(0.08, now + 0.3);
                g.gain.linearRampToValueAtTime(0, now + 1.5);
                
                // 加入顫音效果 (LFO)
                const lfo = ctx.createOscillator();
                lfo.frequency.value = 15;
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 30;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(now); lfo.stop(now + 1.5);
                
                osc.connect(g); g.connect(ctx.destination);
                osc.start(now); osc.stop(now + 1.5);
            };

            const playReveal = () => {
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.frequency.setValueAtTime(f, now + (i * 0.05));
                    g.gain.setValueAtTime(0.1, now);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 3);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(); osc.stop(now + 3);
                });
            };

            const playError = () => {
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                g.gain.setValueAtTime(0.15, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.5);
            };

            return { init, startInteractionSounds, updateChargePitch, releaseSpin, stopInteractionSounds, playAnalysis, playReveal, playError };
        })();

        const messages = [
            "潮汐正在為你轉向，請保持耐心與信心。", "在靜止的虛空中，你會找到最重要的答案。", "一條新的道路正在你面前無聲地展開。",
            "信任目前的混亂，它正在為你重組新的秩序。", "你的潛力如繁星般浩瀚，永遠不要低估自己。", "放開那些不再讓你成長的陳舊錨點，讓心自由。",
            "當你與內在對齊時，整個宇宙都會溫柔地協助你。", "擁抱未知的奧秘，那是奇蹟發生的起點。", "你所尋求的答案，一直都在你的呼吸之間。",
            "此刻的暫停，是為了下一次更有力的跳躍。", "直覺是靈魂的低語，請試著在安靜中聽它說話。", "每一道裂痕，都是為了讓光能透進你的生命。",
            "原諒過去的自己，就是送給未來最好的禮物。", "像水一樣流動，柔軟中蘊含著穿透岩石的力量。", "你比你想像中更強大，宇宙正注視著你的光。",
            "回歸你的中心，那裡有一片永恆寧靜的海洋。", "不要急著看到結果，開花的過程同樣重要。", "你正在經歷的挑戰，是為了塑造更完整的你。",
            "星星在黑暗中才最耀眼，你的光芒亦然。", "宇宙從不趕時間，一切都在完美的時刻發生。", "當你放下控制的執著，真正的豐盛才會流向你。",
            "簡單的一步，勝過千萬次腦中的徘徊。", "你內心的平靜，是應對外界混亂最強大的武器。", "不需要成為完美的人，只需要成為真實的自己。",
            "目前的阻礙並非終點，而是通往奇蹟的轉向燈。", "愛是你生命中唯一的北極星，請跟隨它的引導。", "每一天的早晨，都是宇宙對你投下的信任票。",
            "你是能量的載體，請選擇滋養你靈魂的事物。", "宇宙的回聲，通常在你最放鬆的時候響起。", "信任生命流動的智慧，你正被妥善地照顧著。",
            "你的夢想已經在量子場中成形，只需等待時機成熟。", "去感受風、感受陽光，那是宇宙與你肌膚的對話。", "當你對自己溫柔，世界也會開始對你展現柔情。",
            "放下沉重的行囊，輕裝上陣才能走得更遠。", "深呼吸，感受這股支撐你生命前行的無限力量。", "每一次心碎，都是為了讓更寬廣的愛流入。",
            "不要讓外界的嘈雜，淹沒了你內心神聖的羅盤。", "你是一顆種子，黑暗的時刻正是你紮根的契機。", "豐盛不在遠方，而在你察覺到當下美好的瞬間。",
            "你的直覺從未出錯，只是你偶爾忘記了聽從。", "去創造、去玩耍，宇宙愛死你快樂的樣子了。", "當你停止尋找，你想要的東西就會出現。",
            "宇宙的門扉始終開啟，只要你相信自己值得。", "沉默有時是最高級的回答，請享受這份靜謐。", "你是光的一部分，黑暗永遠無法將你吞噬。",
            "當前的困難只是幻象，你的本質是永恆的自由。", "每一次的選擇，都在編織你獨一無二的現實。", "信任那些無法解釋的驚喜，那是宇宙在對你眨眼。",
            "回歸簡約，你會讓空白處發現最豐富的靈感。", "你的存在本身，就是對這個世界最大的貢獻。", "在孤獨中盛開，在人群中保持清醒。",
            "現在的每一刻，都是重啟人生的最佳起點。", "讓勇氣成為你的羽翼，帶你飛越恐懼的峽谷。", "宇宙與你同在，你從來都不是孤身一人。",
            "細心觀察，生活到處都藏著神聖的暗號。", "你是無限可能性的海洋，而非狹窄的溪流。", "感謝當下的所有，感謝正在演化的自己。",
            "在呼吸中連結大地，在靜心中連結星辰。", "你不需要向誰證明，你只需向自己綻放。"
        ];

        const portalContainer = document.getElementById('portal-container');
        const portalCard = document.getElementById('portal-card');
        const ring = document.getElementById('roulette-ring'); 
        const vortex = document.getElementById('vortex-bg'); 
        const hint = document.getElementById('main-hint'); 
        const msgEl = document.getElementById('message-text'); 
        const guideText = document.getElementById('guide-text');
        
        let state = 'IDLE'; 
        let velocity = 0;
        let angle = 0;
        let animFrame;

        const MAX_VELOCITY = 28; 
        const ACCELERATION = 0.25; 
        const FRICTION = 0.985;   

        async function startCamera() {
            try { 
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }); 
                document.getElementById('camera-video').srcObject = s; 
            } catch (e) { guideText.innerText = "建議開啟相機以進行感應"; }
        }
        startCamera();

        function physicsLoop() {
            if (state === 'CHARGING') {
                velocity += ACCELERATION;
                if (velocity > MAX_VELOCITY) velocity = MAX_VELOCITY;
                SoundEngine.updateChargePitch(velocity);
            } else if (state === 'SPINNING') {
                velocity *= FRICTION; 
                if (velocity < 0.1) {
                    velocity = 0;
                    triggerAnalysis(angle); // 改變：不直接翻牌，先進入分析階段
                    return; 
                }
            }

            if (state === 'CHARGING' || state === 'SPINNING') {
                angle += velocity;
                ring.style.transform = `rotate(${angle}deg)`;
                vortex.style.transform = `rotate(${-angle * 0.3}deg)`;
            }
            animFrame = requestAnimationFrame(physicsLoop);
        }

        function startInteraction(e) {
            if (state === 'FLIPPED') { resetSystem(); return; }
            if (state === 'SPINNING' || state === 'ANALYZING') return; // 分析期間禁止干擾

            SoundEngine.init();
            SoundEngine.startInteractionSounds();
            
            state = 'CHARGING';
            velocity = 0; 
            
            portalContainer.style.transform = "scale(0.96)";
            
            hint.innerText = "能量匯聚中... 鬆開手指擲出";
            hint.className = "instruction-bar charging";
            guideText.style.opacity = '0';

            cancelAnimationFrame(animFrame);
            physicsLoop();
        }

        function releaseInteraction(e) {
            if (state !== 'CHARGING') return;
            
            portalContainer.style.transform = "scale(1)";

            if (velocity < 3) {
                state = 'IDLE';
                cancelAnimationFrame(animFrame);
                SoundEngine.stopInteractionSounds();
                hint.innerText = "能量不足，請長按蓄能";
                hint.className = "instruction-bar";
                guideText.style.opacity = '1';
                setTimeout(() => { if(state === 'IDLE') hint.innerText = "按住螢幕為星盤蓄能，鬆開擲出"; }, 1500);
                return;
            }

            state = 'SPINNING';
            SoundEngine.releaseSpin(); 
            hint.innerText = "命運輪轉中...";
            hint.className = "instruction-bar spinning";
        }

        // 階段 1：停格分析特效
        function triggerAnalysis(finalAngle) {
            state = 'ANALYZING'; // 設定為分析狀態
            
            let videoEl = document.getElementById('camera-video');
            if (videoEl && videoEl.srcObject) {
                videoEl.pause(); // 停格相機畫面
            }

            SoundEngine.playAnalysis(); // 播放分析掃描音效
            
            hint.innerText = "讀取靈魂頻率中...";
            hint.className = "instruction-bar spinning";
            
            // 觸發光暈掃描動畫
            const scanRing = document.getElementById('analysis-ring');
            scanRing.classList.add('active');

            // 等待 1.5 秒的儀式感後，執行翻牌判斷
            setTimeout(() => {
                scanRing.classList.remove('active');
                executeReveal(finalAngle);
            }, 1500);
        }

        // 階段 2：執行結果判斷與翻牌
        function executeReveal(finalAngle) {
            let normalizedAngle = Math.abs(finalAngle % 360);
            let videoEl = document.getElementById('camera-video');
            
            // 將失敗機率調整為約 30%
            let currentSectorAngle = normalizedAngle % 45;
            let isSuccess = currentSectorAngle >= 13.5;

            if (!isSuccess) {
                state = 'IDLE';
                SoundEngine.stopInteractionSounds();
                SoundEngine.playError(); 

                guideText.innerText = "探測失敗：雜訊過多";
                guideText.style.color = "#ff4a4a"; 
                guideText.style.opacity = '1';
                
                portalContainer.classList.add('error-shake');
                setTimeout(() => portalContainer.classList.remove('error-shake'), 500);

                hint.innerText = "頻率干擾，請重新蓄能";
                hint.className = "instruction-bar";

                setTimeout(() => {
                    if (state === 'IDLE') {
                        guideText.innerText = "請將臉部對準中央";
                        guideText.style.color = "var(--light-gold)";
                        hint.innerText = "按住螢幕為星盤蓄能，鬆開擲出";
                        if (videoEl && videoEl.srcObject) videoEl.play(); // 恢復相機
                    }
                }, 2000);
                
                return; 
            }

            // 成功探測
            state = 'FLIPPED';
            SoundEngine.stopInteractionSounds();
            SoundEngine.playReveal();

            let sliceSize = 360 / messages.length;
            let selectedIndex = Math.floor(normalizedAngle / sliceSize);
            selectedIndex = Math.min(Math.max(selectedIndex, 0), messages.length - 1);

            msgEl.innerText = messages[selectedIndex];
            
            portalContainer.classList.add('flipped');
            hint.innerText = "點擊卡牌重新感應";
            hint.className = "instruction-bar";
        }

        function resetSystem() {
            if (state === 'ANALYZING') return; // 分析期間不允許重置
            state = 'IDLE';
            portalContainer.classList.remove('flipped');
            angle = 0; velocity = 0;
            ring.style.transform = `rotate(0deg)`;
            vortex.style.transform = `rotate(0deg)`;
            guideText.style.opacity = '1';
            hint.innerText = "按住螢幕為星盤蓄能，鬆開擲出";
            
            let videoEl = document.getElementById('camera-video');
            if (videoEl && videoEl.srcObject) {
                videoEl.play();
            }
        }

        // 事件監聽
        portalContainer.addEventListener('mousedown', startInteraction);
        window.addEventListener('mouseup', releaseInteraction);
        
        portalContainer.addEventListener('touchstart', (e) => {
            if (state !== 'FLIPPED') e.preventDefault(); 
            startInteraction(e);
        }, {passive: false});
        
        window.addEventListener('touchend', releaseInteraction);

        // 關閉開場說明視窗
        document.getElementById('start-btn').addEventListener('click', () => {
            const modal = document.getElementById('intro-modal');
            modal.classList.add('hidden');
            SoundEngine.init();
        });
    </script>
</body>
</html>
