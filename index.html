<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耳朵學院 EP009</title>
<style>
    :root {
        --ink: #112238;
        --mid: #3b5f7e;
        --cream: #f1ebd7;
        --shadow: rgba(17, 34, 56, 0.45);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1c2e;
        font-family: "Arial Black", Impact, sans-serif;
    }

    .poster-frame {
        width: min(92vw, 960px);
        aspect-ratio: 2 / 3;
        background: var(--cream);
        border: 10px solid var(--ink);
        box-shadow: 18px 18px 0 var(--shadow);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        justify-content: center;
    }

    .poster-frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .overlay {
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 26px 26px 30px;
        background: linear-gradient(180deg, rgba(17, 34, 56, 0) 0%, rgba(17, 34, 56, 0.92) 100%);
        color: var(--cream);
        text-align: left;
    }

    .label {
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 0.85rem;
        opacity: 0.85;
        margin-bottom: 8px;
        font-family: sans-serif;
        font-weight: bold;
    }

    h1 {
        margin: 0 0 14px;
        font-size: 2.1rem;
        letter-spacing: 1px;
    }

    .copy {
        font-family: sans-serif;
        font-weight: bold;
        color: var(--cream);
        line-height: 1.6;
        font-size: 0.95rem;
        margin-bottom: 18px;
    }

    .copy .lead {
        margin: 0 0 10px;
    }

    .hint-inline {
        color: #d4d9dd;
    }

    #enterBtn {
        display: inline-block;
        padding: 10px 22px;
        background: var(--cream);
        color: var(--ink);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--shadow);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.9rem;
        cursor: pointer;
    }

    #enterBtn:disabled {
        opacity: 0.7;
        cursor: default;
    }

    #enterBtn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--shadow);
    }

    @media (max-width: 720px) {
        .poster-frame {
            width: 92vw;
        }

        h1 {
            font-size: 1.7rem;
        }

        .copy {
            font-size: 0.9rem;
        }
    }
</style>
</head>
<body>
    <div class="poster-frame">
        <img src="poster.jpg" alt="耳朵學院 EP009 海報">
        <div class="overlay">
            <div class="label">ep009</div>
            <h1>耳朵學院</h1>
            <div class="copy">
                <p class="lead">《耳朵學院》是一所限時開放的感知場所，引導參與者重新學習如何用耳朵感知世界。在資訊過載的時代，人們對周遭一切變得麻木。耳朵學院「限時開課」的機制，將聽覺轉化為一套可被設計與訓練的感知系統。</p>
                <p class="lead">觀眾進入課程完成一系列聽覺任務，重新校準人與環境之間的感知關係。<span class="hint-inline">這不是一件靜態的作品，而是一段不可重複的感知經驗。</span></p>
            </div>
            <button class="primary" id="enterBtn" disabled>初始化中...</button>
        </div>
    </div>

<script>
const launchDate = new Date("2026-03-22T20:00:00").getTime();
const button = document.getElementById("enterBtn");
let hasActivated = false;

function updateCountdown() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance <= 0 && !hasActivated) {
        hasActivated = true;

        button.innerHTML = "課程開放";
        button.classList.add("live-transition");

        setTimeout(() => {
            button.innerHTML = "進入";
            button.disabled = false;
        }, 1000);

        return;
    }

    if (!hasActivated) {
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((distance / (1000 * 60)) % 60);
        const seconds = Math.floor((distance / 1000) % 60);

        button.innerHTML = `${days}天 ${hours}時 ${minutes}分 ${seconds}秒`;
    }
}

setInterval(updateCountdown, 1000);
updateCountdown();

button.addEventListener("click", function() {
    if (!button.disabled) {
        window.location.href = "ep009.html";
    }
});
</script>
</body>
</html>
