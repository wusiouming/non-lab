<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Reflex - Voice Calibration Flow</title>
    <style>
        /* Color Palette based on the image */
        :root {
            --dark-navy: #112238;
            --mid-blue: #3b5f7e;
            --light-blue: #7a9cb3;
            --cream: #f1ebd7;
            --alert: #d9534f; /* For false starts */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: var(--cream);
            /* Halftone pattern simulation */
            background-image: 
                radial-gradient(var(--light-blue) 15%, transparent 16%),
                radial-gradient(var(--light-blue) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 90%;
            max-width: 500px;
            background-color: var(--cream);
            border: 8px solid var(--dark-navy);
            border-radius: 12px;
            box-shadow: 15px 15px 0px var(--mid-blue);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--dark-navy);
            color: var(--cream);
            padding: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 4px solid var(--mid-blue);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            font-family: sans-serif;
            font-weight: bold;
            color: var(--light-blue);
        }

        #game-board {
            flex-grow: 1;
            height: clamp(280px, 55vh, 420px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: background-color 0.1s;
            touch-action: manipulation;
        }

        /* States */
        #game-board.intro {
            background: linear-gradient(160deg, rgba(241, 235, 215, 0.95), rgba(122, 156, 179, 0.25));
            position: relative;
        }
        #game-board.idle {
            background-color: var(--light-blue);
        }
        #game-board.waiting {
            background-color: var(--mid-blue);
        }
        #game-board.go {
            background-color: var(--dark-navy);
        }
        #game-board.false-start {
            background-color: var(--alert);
        }

        #visual-center {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            z-index: 2;
        }

        /* SVG Styling */
        svg {
            width: 100px;
            height: 100px;
            fill: var(--cream);
            display: none; /* Hidden by default */
        }

        #game-board.idle #icon-stopwatch { display: block; }
        #game-board.waiting #icon-ear { display: block; }
        #game-board.go #icon-target { display: block; }
        #game-board.false-start #icon-error { display: block; }

        /* Soundwave Animations */
        .wave {
            position: absolute;
            border: 4px solid var(--cream);
            border-radius: 50%;
            opacity: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #game-board.waiting .wave {
            animation: pulse-in 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        #game-board.go .wave {
            animation: pulse-out 0.5s ease-out forwards;
        }

        .wave:nth-child(1) { width: 100px; height: 100px; animation-delay: 0s; }
        .wave:nth-child(2) { width: 150px; height: 150px; animation-delay: 0.4s; }
        .wave:nth-child(3) { width: 200px; height: 200px; animation-delay: 0.8s; }

        @keyframes pulse-in {
            0% { width: 250px; height: 250px; opacity: 0; }
            50% { opacity: 0.5; }
            100% { width: 50px; height: 50px; opacity: 0; }
        }

        @keyframes pulse-out {
            0% { width: 50px; height: 50px; opacity: 1; border-width: 10px; }
            100% { width: 400px; height: 400px; opacity: 0; border-width: 2px; }
        }

        #message {
            font-size: 2rem;
            color: var(--cream);
            text-transform: uppercase;
            text-align: center;
            z-index: 2;
            text-shadow: 2px 2px 0px var(--dark-navy);
        }

        #title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 2;
        }

        #submessage {
            margin-top: 8px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: var(--light-blue);
            font-family: sans-serif;
            font-weight: bold;
            text-align: center;
            text-transform: none;
            max-width: 80%;
            z-index: 2;
        }

        #game-board.intro #message {
            color: var(--dark-navy);
            text-shadow: none;
            font-size: 2.4rem;
            letter-spacing: 1px;
            text-transform: none;
        }

        #game-board.intro #submessage {
            color: var(--mid-blue);
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 85%;
        }

        #game-board.intro #visual-center {
            display: none;
        }

        #game-board.intro::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(rgba(59, 95, 126, 0.12) 10%, transparent 11%),
                radial-gradient(rgba(59, 95, 126, 0.08) 10%, transparent 11%);
            background-size: 22px 22px;
            background-position: 0 0, 11px 11px;
            pointer-events: none;
            opacity: 0.6;
        }

        #stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: var(--cream);
            border-top: 4px solid var(--dark-navy);
            font-family: sans-serif;
            font-weight: bold;
            color: var(--dark-navy);
            font-size: 1.05rem;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-value {
            font-size: 1.5rem;
            font-family: 'Arial Black', Impact, sans-serif;
            color: var(--mid-blue);
        }

        /* Decorative concentric lines mimicking the person in the image */
        .bg-lines {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-shadow: 
                inset 0 0 0 10px var(--dark-navy),
                inset 0 0 0 20px transparent,
                inset 0 0 0 30px var(--dark-navy),
                inset 0 0 0 40px transparent,
                inset 0 0 0 50px var(--dark-navy);
            opacity: 0.1;
            pointer-events: none;
        }

        #tracking-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1;
        }

        #ear-indicator {
            position: absolute;
            bottom: 70px;
            width: 36px;
            height: 36px;
            border: 4px solid var(--cream);
            border-radius: 20px 20px 18px 18px;
            box-shadow: inset -6px 0 0 0 var(--cream);
            transform: translateX(-50%);
            display: none;
            z-index: 2;
        }

        #ear-slider {
            position: absolute;
            bottom: 20px;
            width: 70%;
            display: none;
            z-index: 2;
            accent-color: var(--cream);
            touch-action: pan-x;
        }

        #ear-slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--cream);
            border: 2px solid var(--dark-navy);
        }

        #ear-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--cream);
            border: 2px solid var(--dark-navy);
        }

        #skip-stretch {
            position: static;
            padding: 4px 10px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            font-family: sans-serif;
            font-weight: bold;
            color: var(--light-blue);
            background: transparent;
            border: 1px solid var(--light-blue);
            border-radius: 999px;
            text-transform: uppercase;
            cursor: pointer;
            display: none;
            z-index: 3;
            opacity: 0.85;
        }

        #skip-stretch:hover {
            color: var(--dark-navy);
            border-color: var(--dark-navy);
            opacity: 1;
        }

        #final-screen {
            display: none;
            flex: 1;
            padding: 40px 28px 50px;
            background: var(--cream);
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 18px;
        }

        #final-screen h2 {
            margin: 0;
            font-size: 2rem;
            color: var(--dark-navy);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #final-screen p {
            margin: 0;
            color: var(--mid-blue);
            font-family: sans-serif;
            font-weight: bold;
            line-height: 1.5;
        }

        #final-screen .example {
            color: #a0a7ad;
            font-weight: normal;
            font-size: 0.9rem;
        }

        #final-score {
            font-size: 2.4rem;
            color: var(--dark-navy);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #final-screen button {
            margin-top: 18px;
            padding: 12px 28px;
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--cream);
            background: var(--dark-navy);
            border: 3px solid var(--mid-blue);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--mid-blue);
        }

        #final-screen button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--mid-blue);
        }

        @media (max-width: 600px) {
            body {
                padding: 16px 0;
            }

            #app-container {
                width: 92%;
                box-shadow: 10px 10px 0px var(--mid-blue);
            }

            header h1 {
                font-size: 1.25rem;
            }

            #message {
                font-size: 1.7rem;
            }

            #submessage {
                font-size: 0.85rem;
            }

            #stats {
                font-size: 0.95rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            #skip-stretch {
                font-size: 0.6rem;
                padding: 3px 8px;
            }

            #ear-slider {
                width: 78%;
            }

            #final-screen h2 {
                font-size: 1.6rem;
            }

            #final-score {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>Echo Reflex</h1>
            <p>聲音校準流程 · 建議攜帶耳機測試</p>
        </header>

        <div id="game-board" class="idle">
            <div class="bg-lines"></div>
            <canvas id="tracking-canvas"></canvas>
            <div id="ear-indicator" aria-hidden="true"></div>
            <input id="ear-slider" type="range" min="0" max="100" value="50" />
            
            <div id="visual-center">
                <!-- Soundwaves -->
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>

                <!-- SVGs built from scratch -->
                <!-- Stopwatch (Idle) -->
                <svg id="icon-stopwatch" viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="35" stroke="var(--cream)" stroke-width="8" fill="none"/>
                    <rect x="45" y="5" width="10" height="12" rx="2" />
                    <rect x="35" y="0" width="30" height="6" rx="2" />
                    <line x1="50" y1="55" x2="65" y2="40" stroke="var(--cream)" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="55" r="4" fill="var(--cream)"/>
                </svg>

                <!-- Ear (Waiting) -->
                <svg id="icon-ear" viewBox="0 0 100 100">
                    <path d="M40,15 C65,15 80,30 80,50 C80,65 70,75 60,85 C55,90 45,90 40,85 C35,80 35,70 40,65 C45,60 55,55 55,45 C55,35 45,30 40,30 C30,30 25,40 25,50 L15,50 C15,30 25,15 40,15 Z" />
                    <path d="M45,40 C50,40 50,50 45,50 C40,50 40,40 45,40 Z" />
                </svg>

                <!-- Target/Arrow (Go) -->
                <svg id="icon-target" viewBox="0 0 100 100">
                    <circle cx="40" cy="50" r="30" stroke="var(--cream)" stroke-width="8" fill="none"/>
                    <circle cx="40" cy="50" r="15" stroke="var(--cream)" stroke-width="8" fill="none"/>
                    <circle cx="40" cy="50" r="4" fill="var(--cream)"/>
                    <polygon points="50,40 50,60 70,50" fill="var(--cream)"/>
                    <rect x="40" y="46" width="20" height="8" fill="var(--cream)"/>
                </svg>

                <!-- Error (False Start) -->
                <svg id="icon-error" viewBox="0 0 100 100">
                    <line x1="30" y1="30" x2="70" y2="70" stroke="var(--cream)" stroke-width="12" stroke-linecap="round"/>
                    <line x1="70" y1="30" x2="30" y2="70" stroke="var(--cream)" stroke-width="12" stroke-linecap="round"/>
                </svg>
            </div>

            <div id="title-row">
                <div id="message">Click to Start</div>
                <button id="skip-stretch" type="button">略過</button>
            </div>
            <div id="submessage">進入測驗前的小儀式</div>
        </div>

        <div id="final-screen">
            <h2>完成</h2>
            <div id="final-score">綜合 0 分</div>
            <p id="final-summary">你已完成感知校準。</p>
            <p>請對自己說一句鼓勵的話。</p>
            <p class="example">例如：我已經準備好可以開始了。</p>
            <button id="finish-button" type="button">已完成</button>
        </div>

        <div id="stats">
            <div class="stat-box">
                <span>反應時間</span>
                <span id="current-time" class="stat-value">--- ms</span>
            </div>
            <div class="stat-box">
                <span>次數</span>
                <span id="trial-count" class="stat-value">0 / 5</span>
            </div>
            <div class="stat-box">
                <span>總分</span>
                <span id="total-score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span>追蹤分數</span>
                <span id="tracking-score" class="stat-value">0</span>
            </div>
        </div>
    </div>

    <script>
        const gameBoard = document.getElementById('game-board');
        const messageEl = document.getElementById('message');
        const submessageEl = document.getElementById('submessage');
        const currentTimeEl = document.getElementById('current-time');
        const trialCountEl = document.getElementById('trial-count');
        const totalScoreEl = document.getElementById('total-score');
        const trackingScoreEl = document.getElementById('tracking-score');
        const trackingCanvas = document.getElementById('tracking-canvas');
        const earSlider = document.getElementById('ear-slider');
        const earIndicator = document.getElementById('ear-indicator');
        const skipStretchButton = document.getElementById('skip-stretch');
        const finalScreen = document.getElementById('final-screen');
        const finalSummary = document.getElementById('final-summary');
        const finalScoreEl = document.getElementById('final-score');
        const finishButton = document.getElementById('finish-button');

        const TOTAL_TRIALS = 5;
        const PASS_SCORE = 60;
        const TRACKING_DURATION_MS = 20000;
        const TRACKING_PASS_SCORE = 60;

        let state = 'intro';
        let timeoutId;
        let intervalId;
        let startTime;
        let trialIndex = 0;
        let totalScore = 0;

        let trackingStartTime = 0;
        let trackingScore = 0;
        let trackingSamples = 0;
        let trackingErrorSum = 0;
        let trackingAnimId;
        let trackingTone;
        let trackingPanner;
        let trackingGain;
        let targetPosition = 0.5;
        let targetVelocity = 0.15;

        // Web Audio API setup for the "Beep"
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square'; // Harsher sound for reaction
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function resetTimers() {
            clearTimeout(timeoutId);
            clearInterval(intervalId);
        }

        function setBoardState(className) {
            gameBoard.className = className;
        }

        function showMainUI(show) {
            gameBoard.style.display = show ? 'flex' : 'none';
            document.getElementById('stats').style.display = show ? 'flex' : 'none';
            finalScreen.style.display = show ? 'none' : 'flex';
        }

        function showStats(show) {
            document.getElementById('stats').style.display = show ? 'flex' : 'none';
        }

        function showSkipStretch(show) {
            skipStretchButton.style.display = show ? 'inline-flex' : 'none';
        }

        function resetStats() {
            currentTimeEl.innerText = '--- ms';
            trialCountEl.innerText = `0 / ${TOTAL_TRIALS}`;
            totalScoreEl.innerText = '0';
            trackingScoreEl.innerText = '0';
        }

        function setIntro() {
            resetTimers();
            state = 'intro';
            setBoardState('intro');
            showTrackingUI(false);
            showMainUI(true);
            showSkipStretch(false);
            messageEl.innerText = '感知校準';
            submessageEl.innerText = '這是一個幫助你專注在當下的練習，把注意力帶回此刻，感覺呼吸、身體與空間裡的細小聲音。';
            finalSummary.innerText = '你已完成感知校準。';
            finalScoreEl.innerText = '綜合 0 分';
            finishButton.disabled = false;
            finishButton.innerText = '已完成';
            showStats(false);
            resetStats();
            trialIndex = 0;
            totalScore = 0;
            trackingScore = 0;
            targetPosition = 0.5;
            earSlider.value = '50';
            updateEarIndicator();
        }

        function startStretchIntro() {
            resetTimers();
            state = 'stretch-ready';
            setBoardState('waiting');
            showTrackingUI(false);
            showSkipStretch(true);
            showStats(true);
            messageEl.innerText = '伸展';
            submessageEl.innerText = '跟著提示做 30 秒伸展，點擊開始';
        }

        function startStretch() {
            resetTimers();
            state = 'stretching';
            setBoardState('waiting');
            showTrackingUI(false);
            showSkipStretch(true);
            showStats(true);
            let remaining = 30;
            messageEl.innerText = '伸展';
            submessageEl.innerText = `伸展雙手，剩餘 ${remaining} 秒`;
            intervalId = setInterval(() => {
                remaining -= 1;
                const elapsed = 30 - remaining;
                let guide = '伸展雙手';
                if (elapsed >= 10 && elapsed < 20) {
                    guide = '轉動肩膀';
                } else if (elapsed >= 20) {
                    guide = '輕旋脖子';
                }
                submessageEl.innerText = `${guide}，剩餘 ${remaining} 秒`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    startCalibrationIntro();
                }
            }, 1000);
        }

        function startCalibrationIntro() {
            resetTimers();
            state = 'calibration-idle';
            setBoardState('idle');
            showTrackingUI(false);
            showSkipStretch(false);
            showStats(true);
            messageEl.innerText = `校準測驗 ${trialIndex + 1} / ${TOTAL_TRIALS}`;
            submessageEl.innerText = '聽到聲音再點擊，準備好就開始';
        }

        function setWaiting() {
            initAudio();
            state = 'waiting';
            setBoardState('waiting');
            showTrackingUI(false);
            showSkipStretch(false);
            showStats(true);
            messageEl.innerText = '聽聲音';
            submessageEl.innerText = '等到聲音出現再點擊';

            const delay = Math.floor(Math.random() * 3000) + 2000;
            timeoutId = setTimeout(() => {
                setGo();
            }, delay);
        }

        function setGo() {
            state = 'go';
            setBoardState('go');
            showTrackingUI(false);
            showSkipStretch(false);
            showStats(true);
            messageEl.innerText = '點擊';
            submessageEl.innerText = '現在';
            playBeep();
            startTime = performance.now();
        }

        function scoreByTime(ms) {
            if (ms <= 200) return 20;
            if (ms <= 250) return 18;
            if (ms <= 300) return 16;
            if (ms <= 350) return 14;
            if (ms <= 400) return 12;
            if (ms <= 450) return 10;
            if (ms <= 500) return 8;
            if (ms <= 600) return 6;
            if (ms <= 700) return 4;
            if (ms <= 800) return 2;
            return 0;
        }

        function applyTrialResult(reactionTime, isFalseStart) {
            const score = isFalseStart ? 0 : scoreByTime(reactionTime);
            totalScore += score;
            trialIndex += 1;

            totalScoreEl.innerText = `${totalScore}`;
            trialCountEl.innerText = `${trialIndex} / ${TOTAL_TRIALS}`;

            if (isFalseStart) {
                messageEl.innerText = '太早了';
                submessageEl.innerText = '本次 0 分';
                currentTimeEl.innerText = '--- ms';
                setBoardState('false-start');
            } else {
                messageEl.innerText = `${reactionTime} ms`;
                submessageEl.innerText = `本次 ${score} 分`;
                currentTimeEl.innerText = `${reactionTime} ms`;
                setBoardState('idle');
            }

            state = 'result';
            timeoutId = setTimeout(() => {
                if (trialIndex >= TOTAL_TRIALS) {
                    showSummary();
                } else {
                    startCalibrationIntro();
                }
            }, 1400);
        }

        function setFalseStart() {
            clearTimeout(timeoutId);
            applyTrialResult(0, true);
        }

        function setResult() {
            const endTime = performance.now();
            const reactionTime = Math.round(endTime - startTime);
            applyTrialResult(reactionTime, false);
        }

        function showSummary() {
            resetTimers();
            const passed = totalScore >= PASS_SCORE;
            showTrackingUI(false);
            showSkipStretch(false);
            showStats(true);
            if (passed) {
                state = 'calibration-pass';
                setBoardState('idle');
                messageEl.innerText = `校準通過 ${totalScore} 分`;
                submessageEl.innerText = '點擊進入「聲音追蹤」測驗';
            } else {
                state = 'calibration-fail';
                setBoardState('false-start');
                messageEl.innerText = `校準未通過 ${totalScore} 分`;
                submessageEl.innerText = '未達門檻，點擊重來';
            }
        }

        function showTrackingUI(show) {
            trackingCanvas.style.display = show ? 'block' : 'none';
            earSlider.style.display = show ? 'block' : 'none';
            earIndicator.style.display = show ? 'block' : 'none';
        }

        function updateEarIndicator() {
            const value = Number(earSlider.value) / 100;
            const boardRect = gameBoard.getBoundingClientRect();
            const padding = 24;
            const x = padding + value * (boardRect.width - padding * 2);
            earIndicator.style.left = `${x}px`;
        }

        function startTrackingIntro() {
            resetTimers();
            state = 'tracking-ready';
            setBoardState('waiting');
            showTrackingUI(true);
            showSkipStretch(false);
            showStats(true);
            messageEl.innerText = '聲音追蹤';
            submessageEl.innerText = '聲源在左右漂移，移動滑桿跟上它，點擊開始';
        }

        function startTracking() {
            resetTimers();
            state = 'tracking';
            setBoardState('go');
            showTrackingUI(true);
            showSkipStretch(false);
            showStats(true);
            messageEl.innerText = '跟著聲音';
            submessageEl.innerText = '保持耳朵對齊聲源';
            trackingStartTime = performance.now();
            trackingSamples = 0;
            trackingErrorSum = 0;

            initAudio();
            trackingGain = audioCtx.createGain();
            trackingGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            trackingTone = audioCtx.createOscillator();
            trackingTone.type = 'sine';
            trackingTone.frequency.setValueAtTime(392, audioCtx.currentTime);

            if (audioCtx.createStereoPanner) {
                trackingPanner = audioCtx.createStereoPanner();
                trackingTone.connect(trackingPanner);
                trackingPanner.connect(trackingGain);
            } else {
                trackingPanner = null;
                trackingTone.connect(trackingGain);
            }
            trackingGain.connect(audioCtx.destination);
            trackingTone.start();

            trackingAnimId = requestAnimationFrame(animateTracking);
            intervalId = setInterval(sampleTracking, 50);
            timeoutId = setTimeout(finishTracking, TRACKING_DURATION_MS);
        }

        function stopTrackingAudio() {
            if (trackingTone) {
                trackingTone.stop();
                trackingTone.disconnect();
                trackingTone = null;
            }
            if (trackingPanner) {
                trackingPanner.disconnect();
                trackingPanner = null;
            }
            if (trackingGain) {
                trackingGain.disconnect();
                trackingGain = null;
            }
        }

        function sampleTracking() {
            const sliderValue = Number(earSlider.value) / 100;
            const error = Math.abs(sliderValue - targetPosition);
            trackingErrorSum += error;
            trackingSamples += 1;
        }

        function finishTracking() {
            resetTimers();
            cancelAnimationFrame(trackingAnimId);
            stopTrackingAudio();
            const avgError = trackingSamples ? trackingErrorSum / trackingSamples : 1;
            trackingScore = Math.max(0, Math.round(100 - avgError * 100));
            trackingScoreEl.innerText = `${trackingScore}`;
            showTrackingResult();
        }

        function showTrackingResult() {
            const passed = trackingScore >= TRACKING_PASS_SCORE;
            showTrackingUI(false);
            showSkipStretch(false);
            if (passed) {
                state = 'final-summary';
                showMainUI(false);
                const compositeScore = Math.round((totalScore + trackingScore) / 2);
                finalScoreEl.innerText = `綜合 ${compositeScore} 分`;
                finalSummary.innerText = `校準 ${totalScore} 分｜追蹤 ${trackingScore} 分`;
            } else {
                state = 'tracking-fail';
                setBoardState('false-start');
                messageEl.innerText = `追蹤未通過 ${trackingScore} 分`;
                submessageEl.innerText = '未達門檻，點擊重來';
            }
        }

        function resizeCanvas() {
            const rect = gameBoard.getBoundingClientRect();
            trackingCanvas.width = rect.width;
            trackingCanvas.height = rect.height;
            updateEarIndicator();
        }

        const particles = [];
        function initParticles() {
            particles.length = 0;
            const count = 60;
            for (let i = 0; i < count; i += 1) {
                particles.push({
                    x: Math.random(),
                    y: Math.random(),
                    speed: 0.1 + Math.random() * 0.3,
                    width: 0.03 + Math.random() * 0.05
                });
            }
        }

        function animateTracking(timestamp) {
            const ctx = trackingCanvas.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, trackingCanvas.width, trackingCanvas.height);
            ctx.fillStyle = 'rgba(17, 34, 56, 0.12)';
            ctx.fillRect(0, 0, trackingCanvas.width, trackingCanvas.height);

            ctx.strokeStyle = 'rgba(241, 235, 215, 0.5)';
            ctx.lineWidth = 2;
            particles.forEach((p) => {
                p.y -= p.speed * 0.005;
                if (p.y < -0.1) p.y = 1.1;
                const x = p.x * trackingCanvas.width;
                const y = p.y * trackingCanvas.height;
                const w = p.width * trackingCanvas.width;
                ctx.beginPath();
                ctx.moveTo(x - w / 2, y);
                ctx.lineTo(x + w / 2, y);
                ctx.stroke();
            });

            const time = (timestamp - trackingStartTime) / 1000;
            targetPosition += targetVelocity * 0.01;
            const drift = 0.15 * Math.sin(time * 1.6) + 0.1 * Math.sin(time * 0.7);
            targetPosition = Math.min(1, Math.max(0, targetPosition + drift * 0.01));
            if (targetPosition <= 0 || targetPosition >= 1) {
                targetVelocity *= -1;
            }

            if (trackingPanner) {
                trackingPanner.pan.setValueAtTime(targetPosition * 2 - 1, audioCtx.currentTime);
            }

            updateEarIndicator();
            trackingAnimId = requestAnimationFrame(animateTracking);
        }

        // Main Interaction Logic
        gameBoard.addEventListener('mousedown', () => {
            switch (state) {
                case 'intro':
                    startStretchIntro();
                    break;
                case 'stretch-ready':
                    startStretch();
                    break;
                case 'calibration-idle':
                    setWaiting();
                    break;
                case 'waiting':
                    setFalseStart();
                    break;
                case 'go':
                    setResult();
                    break;
                case 'calibration-pass':
                    startTrackingIntro();
                    break;
                case 'calibration-fail':
                    setIntro();
                    break;
                case 'tracking-ready':
                    startTracking();
                    break;
                case 'tracking-pass':
                case 'tracking-fail':
                    setIntro();
                    break;
                case 'final-summary':
                case 'stretching':
                case 'result':
                default:
                    break;
            }
        });

        // Prevent default touch behaviors to avoid zooming/scrolling on mobile
        gameBoard.addEventListener('touchstart', (e) => {
            if (e.target.closest('input, button')) return;
            e.preventDefault();
            initAudio();
            const touchEvent = new MouseEvent('mousedown');
            gameBoard.dispatchEvent(touchEvent);
        }, { passive: false });

        earSlider.addEventListener('input', updateEarIndicator);
        earSlider.addEventListener('mousedown', (event) => event.stopPropagation());
        earSlider.addEventListener('touchstart', (event) => event.stopPropagation(), { passive: true });
        window.addEventListener('resize', resizeCanvas);
        skipStretchButton.addEventListener('click', (event) => {
            event.stopPropagation();
            if (state !== 'stretch-ready' && state !== 'stretching') return;
            startCalibrationIntro();
        });
        skipStretchButton.addEventListener('mousedown', (event) => event.stopPropagation());
        finishButton.addEventListener('click', () => {
            if (state !== 'final-summary') return;
            setIntro();
        });

        initParticles();
        resizeCanvas();
        setIntro();
    </script>
</body>
</html>
